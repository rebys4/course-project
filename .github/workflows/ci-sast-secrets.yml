name: Security - SAST & Secrets

on:
    workflow_dispatch:
    push:
        paths:
            - "**/*.py"
            - "app/**"
            - "security/**"
            - ".github/workflows/ci-sast-secrets.yml"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    sast_secrets:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Ensure evidence dirs
              run: mkdir -p EVIDENCE/P10 security/semgrep

            # --- SAST: Semgrep ---
            - name: Run Semgrep (SAST)
              run: |
                  docker run --rm \
                    -v "$PWD:/src" \
                    returntocorp/semgrep:latest \
                    semgrep ci \
                      --config p/ci \
                      --config /src/security/semgrep/rules.yml \
                      --sarif -o /src/EVIDENCE/P10/semgrep.sarif \
                      --error || true

            # --- Secrets: Gitleaks ---
            - name: Run Gitleaks (Secrets scan)
              run: |
                  docker run --rm \
                    -v "$PWD:/repo" \
                    zricethezav/gitleaks:latest \
                    detect \
                      --source=/repo \
                      --config=/repo/security/.gitleaks.toml \
                      --report-path=/repo/EVIDENCE/P10/gitleaks.json \
                      --report-format=json || true

            # --- Summary (опционально, но полезно) ---
            - name: Build SAST & Secrets summary
              run: |
                  sudo apt-get update && sudo apt-get install -y jq >/dev/null 2>&1 || true
                  echo "# SAST & Secrets summary" > EVIDENCE/P10/sast_summary.md

                  echo "## Semgrep" >> EVIDENCE/P10/sast_summary.md
                  if [ -f EVIDENCE/P10/semgrep.sarif ]; then
                    issues=$(jq '[.runs[].results[]] | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "n/a")
                    echo "Findings: $issues" >> EVIDENCE/P10/sast_summary.md
                  else
                    echo "semgrep.sarif not found" >> EVIDENCE/P10/sast_summary.md
                  fi

                  echo "" >> EVIDENCE/P10/sast_summary.md
                  echo "## Gitleaks" >> EVIDENCE/P10/sast_summary.md
                  if [ -f EVIDENCE/P10/gitleaks.json ]; then
                    leaks=$(jq '.findings | length' EVIDENCE/P10/gitleaks.json 2>/dev/null || echo "n/a")
                    echo "Findings: $leaks" >> EVIDENCE/P10/sast_summary.md
                  else
                    echo "gitleaks.json not found" >> EVIDENCE/P10/sast_summary.md
                  fi

            - name: Upload SAST & Secrets evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: P10_EVIDENCE
                  path: EVIDENCE/P10
